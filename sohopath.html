<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সহপাঠ — HSC বাংলা ১ম পত্র</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: linear-gradient(135deg, #0f172a, #172554, #0f172a);
      color: white;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 30px 15px 20px;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      color: #cbd5e1;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: auto;
      padding-bottom: 50px;
    }

    .back {
      display: inline-block;
      margin: 10px 0 20px;
      color: #93c5fd;
      text-decoration: none;
    }

    .subject-card {
      background: rgba(30, 41, 59, 0.96);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 25px;
    }

    .book {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 10px;
      border-bottom: 1px solid #334155;
    }

    .book:last-child {
      border-bottom: none;
    }

    .book-info {
      line-height: 1.6;
    }

    .book-number {
      color: #93c5fd;
      font-weight: bold;
      font-size: 14px;
    }

    .book-name {
      font-size: 16px;
      font-weight: 500;
    }

    .author {
      color: #94a3b8;
      font-size: 13px;
    }

    .read-btn {
      flex-shrink: 0;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
    }

    .read-btn:hover {
      background: #1d4ed8;
    }

    footer {
      text-align: center;
      color: #94a3b8;
      padding: 25px;
      font-size: 13px;
    }
  </style>
</head>
<body>

<header>
  <h1>📚 সহপাঠ অংশ</h1>
  <p>এইচএসসি বাংলা ১ম পত্র (উপন্যাস ও নাটক)</p>
</header>

<div class="container">
  <a class="back" href="bangla.html">← বাংলা পেজে ফিরে যান</a>

  <div class="subject-card">
    
    <div class="book">
      <div class="book-info">
        <div class="book-number">১.</div>
        <div class="book-name">লালসালু (উপন্যাস)</div>
        <div class="author">— সৈয়দ ওয়ালীউল্লাহ</div>
      </div>
      <a href="#" class="read-btn">পড়ুন</a>
    </div>

    <div class="book">
      <div class="book-info">
        <div class="book-number">২.</div>
        <div class="book-name">সিরাজউদ্দৌলা (নাটক)</div>
        <div class="author">— সিকদার আবু জাফর</div>
      </div>
      <a href="#" class="read-btn">পড়ুন</a>
    </div>

  </div>
</div>

<footer>
  © 2026 HSC পাঠ্যপুস্তক সমগ্র
</footer>

</body>
</html>
