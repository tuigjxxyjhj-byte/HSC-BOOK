<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পাঠ — HSC পাঠ্যপুস্তক সমগ্র</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      line-height: 1.8;
    }

    .container {
      width: 90%;
      max-width: 800px;
      margin: auto;
      padding: 40px 0;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #93c5fd;
      text-decoration: none;
    }

    .content-box {
      background: rgba(30, 41, 59, 0.96);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 30px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .author-name {
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 25px;
      border-bottom: 1px solid #334155;
      padding-bottom: 15px;
    }

    .article-body {
      font-size: 17px;
      color: #e2e8f0;
    }

    .article-body p {
      margin-bottom: 20px;
    }

    footer {
      text-align: center;
      color: #94a3b8;
      padding: 25px;
      font-size: 13px;
      margin-top: 40px;
      border-top: 1px solid #1e293b;
    }
  </style>
</head>
<body>

<div class="container">
  <a class="back" href="javascript:history.back()">← পেছনের পেজে ফিরে যান</a>

  <div class="content-box">
    <h1 id="title">লেখার নাম এখানে আসবে</h1>
    <div class="author-name" id="author">লেখক: --</div>
    
    <div class="article-body" id="content">
      <p>এখানে মূল পাঠ বা সারসংক্ষেপ প্রদর্শিত হবে। খুব শীঘ্রই এখানে বিস্তারিত লেখা যুক্ত করা হবে।</p>
    </div>
  </div>
</div>

<footer>
  © 2026 HSC পাঠ্যপুস্তক সমগ্র
</footer>

</body>
</html>
